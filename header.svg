<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="220" rx="18" fill="#0d1117"/>

  <rect x="10" y="10" width="880" height="200" rx="14"
        fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="450" y="90"
        text-anchor="middle"
        fill="#ffffff"
